[package]
name = "zd1-webd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The speaker's web control & settings interface: an HTTP server and a JSON API over zd1-linkd and zd1-settings"

[dependencies]
zd1-sys.workspace = true
zd1-settings.workspace = true
sha1 = { version = "0.10", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
